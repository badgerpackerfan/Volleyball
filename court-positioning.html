<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f4">
<!-- "Add to Home Screen" on an iPad then runs this without browser chrome. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Where do I go?">
<title>Where do I go? &mdash; Volleyball</title>
<style>

  :root {
    --bg:      #eef1f4;
    --card:    #ffffff;
    --ink:     #131a21;
    --ink-dim: #5a6771;
    --line:    #d5dce2;
    --accent:  #0f6e7d;
    --court:   #3d6a7a;
    --court-2: #34606f;
    --chalk:   #ffffff;

    /* Role colors - all >= 4.5:1 against white text */
    --c-set:  #b3251f;
    --c-oh:   #1d4ed8;
    --c-mid:  #16713c;

    --radius: 14px;

    /* Swap the first entry to change the typeface everywhere. The stack
       degrades to each platform's modern UI face if the webfont can't load. */
    --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont,
            "Segoe UI Variable Text", "Segoe UI", system-ui, Roboto,
            "Helvetica Neue", Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1317; --card: #171e24; --ink: #eaf0f4; --ink-dim: #9aa8b2;
      --line: #2a343d; --accent: #35a3b3;
    }
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    overscroll-behavior: none;
    padding: 12px 14px calc(20px + env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-optical-sizing: auto;
    line-height: 1.45;
    letter-spacing: -0.006em;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 560px; margin: 0 auto; }

  h1 {
    font-size: 1.3rem;
    margin: 0 0 10px;
    text-align: center;
    letter-spacing: -0.015em;
  }

  /* ---------- Pill selectors ---------- */

  .pill-label {
    margin: 11px 0 4px;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .pill-label:first-of-type { margin-top: 0; }

  .pills {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin: 0;
  }

  /* min-width lets a long pill row wrap on a phone and sit on one
     row once there's space, with no media query. */
  .pill {
    flex: 1 1 auto;
    min-width: 6.2em;
    min-height: 44px;
    padding: 6px 4px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: var(--card);
    color: var(--ink);
    font: inherit;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .pill[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* The passer choice doesn't apply while serving. */
  .muted { opacity: .38; pointer-events: none; }

  /* ---------- Court ---------- */

  .stage {
    width: 100%;
    /* Padding leaves room for players who step off-court (server, wide hitters) */
    padding: 7% 13% 16%;
    margin-top: 4px;
  }

  .court {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    container-type: inline-size;
    background: linear-gradient(var(--court), var(--court-2));
    border: 3px solid var(--chalk);
    border-radius: 3px;
    box-shadow: 0 8px 24px rgba(0,0,0,.18);
  }

  .net {
    position: absolute;
    inset: 0 0 auto 0;
    height: 1.7%;
    background: var(--chalk);
    z-index: 20;
  }

  .attack-line {
    position: absolute;
    top: 33.333%;
    left: 0;
    width: 100%;
    border-top: 2px dashed rgba(255,255,255,.75);
  }

  .mark {
    position: absolute;
    font-size: 3.2cqw;
    font-weight: 700;
    letter-spacing: .08em;
    color: var(--ink-dim);
  }
  .mark-net    { bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 2%; }
  .mark-attack { top: 33.333%; right: 100%; margin-right: 2%; transform: translateY(-50%); white-space: nowrap; }

  /* ---------- Players ---------- */

  .player {
    position: absolute;
    width: 13.333%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 4.6cqw;
    font-weight: 700;
    color: #fff;
    box-shadow: 0 2px 7px rgba(0,0,0,.4);
    transition: left 1.1s ease-in-out, top 1.1s ease-in-out;
    z-index: 10;
  }

  .s,
  .rs  { background: var(--c-set); }
  .oh  { background: var(--c-oh); }
  .m   { background: var(--c-mid); }

  /* Ring = back-row player. Order matters: .lib must win over .back. */
  .player.back { box-shadow: 0 2px 7px rgba(0,0,0,.4), inset 0 0 0 0.9cqw rgba(255,255,255,.92); }
  .player.lib  { background: #fff; color: #111; box-shadow: 0 2px 7px rgba(0,0,0,.4), inset 0 0 0 0.9cqw #111; }

  .ball {
    position: absolute;
    width: 8.333%;
    aspect-ratio: 1 / 1;
    background: #fff;
    border-radius: 50%;
    color: #1a1a1a;
    box-shadow: 0 3px 9px rgba(0,0,0,.45);
    transition: left 1.1s ease-in-out, top 1.1s ease-in-out, opacity .5s;
    z-index: 15;
    pointer-events: none;
  }
  .ball svg { width: 100%; height: 100%; display: block; }

  /* ---------- Step readout ---------- */

  .step { text-align: center; margin-top: 2px; }

  .dots {
    display: flex;
    justify-content: center;
    gap: 2px;
    margin-bottom: 4px;
  }
  .dot {
    width: 30px; height: 30px;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    display: grid;
    place-items: center;
  }
  .dot::after {
    content: "";
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--line);
    transition: background .2s, transform .2s;
  }
  .dot[aria-current="true"]::after { background: var(--accent); transform: scale(1.45); }

  #phase-title {
    font-size: 1.2rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }
  #phase-tip {
    margin: 4px auto 0;
    max-width: 34em;
    color: var(--ink-dim);
    font-size: 0.94rem;
    min-height: 2.8em;
  }

  /* ---------- Controls ---------- */

  .controls {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .btn {
    flex: 1;
    min-height: 54px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--card);
    color: var(--ink);
    font: inherit;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, transform .08s;
  }
  .btn:active { transform: scale(.97); }
  .btn-play { flex: 1.4; background: var(--accent); border-color: var(--accent); color: #fff; }

  .controls-secondary { margin-top: 8px; }
  .controls-secondary .btn { min-height: 50px; }

  .btn-libero[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--bg);
  }

  /* ---------- Legend ---------- */

  .legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 14px;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    font-size: 0.85rem;
    color: var(--ink-dim);
  }
  .legend li { display: flex; align-items: center; gap: 6px; list-style: none; }
  .swatch {
    width: 16px; height: 16px;
    border-radius: 50%;
    flex: none;
  }
  .swatch.lib  { border: 3px solid #111; background: #fff; box-shadow: none; }
  .swatch.ring { background: var(--ink-dim); box-shadow: inset 0 0 0 3px #fff; }

  /* Rotation and passer mean nothing in defense; the situation row means
     nothing outside it. Swapped by a body class rather than inline styles. */
  #lbl-defense, #defense-pills { display: none; }
  body.mode-defense #lbl-defense  { display: block; }
  body.mode-defense #defense-pills { display: flex; }
  body.mode-defense #lbl-rotation,
  body.mode-defense #rotation-pills,
  body.mode-defense #lbl-passer,
  body.mode-defense #passer-pills,
  body.mode-defense #lbl-play,
  body.mode-defense #play-pills { display: none; }

  /* ---------- Collapsed picker (phones) ---------- */

  .summary, .scrim, .picker-done, .picker .legend { display: none; }

  .hint {
    margin: 8px auto 0;
    max-width: 30em;
    color: var(--ink-dim);
    font-size: 0.78rem;
    text-align: center;
    text-wrap: balance;
  }

  @media (max-width: 700px) {
    /* Gestures need both axes, so the court can't also be a scroll surface.
       The rest of the layout is sized to fit without scrolling.
       Full bleed with side padding trimmed to the minimum the off-court
       players need (14.2% of court width) buys ~13% more court. */
    .stage {
      touch-action: none;
      /* Full bleed, but never taller than the room left over - otherwise
         landscape would overflow and there'd be nothing left to scroll with. */
      width: min(calc(100% + 28px), calc((100dvh - 272px) * 1.02));
      position: relative;
      left: 50%;
      transform: translateX(-50%);
      padding: 7% 11.5% 14%;
    }

    h1 { font-size: 1.2rem; margin-bottom: 8px; }

    /* The key moves into the sheet; the footer copy would push us to scroll. */
    .wrap > .legend { display: none; }
    .picker .legend {
      display: flex;
      margin-top: 14px;
      padding-top: 12px;
      font-size: 0.8rem;
    }

    .step { margin-top: 0; }
    #phase-tip { min-height: 2.4em; font-size: 0.88rem; }
    .controls { margin-top: 8px; }

    .summary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 46px;
      padding: 6px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      color: var(--ink);
      font: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
    }
    /* Border triangle rather than a glyph, so it can't render as tofu. */
    .summary::after {
      content: "";
      width: 0; height: 0;
      border: 5px solid transparent;
      border-top-color: currentColor;
      margin-top: 4px;
      flex: none;
    }

    .picker {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 60;
      max-height: 86dvh;
      overflow-y: auto;
      padding: 16px 14px calc(16px + env(safe-area-inset-bottom));
      background: var(--card);
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -10px 34px rgba(0,0,0,.28);
      transform: translateY(101%);
      transition: transform .25s ease;
    }
    body.picker-open .picker { transform: translateY(0); }

    .scrim {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 55;
      background: rgba(0,0,0,.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
    }
    body.picker-open .scrim { opacity: 1; pointer-events: auto; }
    body.picker-open { overflow: hidden; }

    .picker-done {
      display: block;
      width: 100%;
      min-height: 50px;
      margin-top: 14px;
      border: 0;
      border-radius: var(--radius);
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
  }

  @media (max-width: 700px) and (prefers-reduced-motion: reduce) {
    .picker, .scrim { transition: none; }
  }

  /* ---------- Two columns on a wide landscape screen ----------
     Single column wastes most of the width here and still needs scrolling.
     Selectors go in a sidebar; the court takes the rest. */
  @media (min-width: 900px) and (orientation: landscape) {
    .wrap {
      max-width: 1180px;
      display: grid;
      grid-template-columns: 288px minmax(0, 1fr);
      grid-template-areas:
        "title  court"
        "picker court"
        "picker step"
        "picker controls"
        "picker hint";
      column-gap: 32px;
      align-items: start;
    }

    h1        { grid-area: title;    text-align: left; margin: 2px 0 12px; }
    .picker   { grid-area: picker; }
    .stage    { grid-area: court;    margin: 0 auto; }
    .step     { grid-area: step; }
    .controls { grid-area: controls; }
    .hint     { grid-area: hint; }

    /* Still height-bound, so cap the court by the room left under it.
       224px covers the step block, controls, hint and body padding. */
    .stage {
      width: min(100%, calc((100vh - 224px) * 1.03));
      width: min(100%, calc((100dvh - 224px) * 1.03));
    }

    /* Safe here: this layout fits without scrolling, so the court can own
       its drags instead of handing them to the browser. */
    .stage { touch-action: none; }

    /* Narrower than the default 6.2em so three rotation pills share a row
       in a 288px column instead of wrapping to two. */
    .picker .pill { min-width: 5.8em; }

    /* The key reads better stacked in a narrow column than wrapped. */
    .wrap > .legend { display: none; }
    .picker .legend {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 7px;
      margin-top: 16px;
      padding-top: 14px;
    }
  }

  /* ---------- Full-screen focus mode ----------
     Driven by a body class, not the Fullscreen API, so it fills the window
     even where element fullscreen is unsupported (notably Safari on iOS).
     Native fullscreen is requested on top of it when available. */

  .exit-focus, .focus-title { display: none; }

  /* In full screen the picker and the summary bar are both hidden, so this
     is the only thing saying what you're looking at. */
  body.focus .focus-title {
    display: block;
    margin: 0 0 8px;
    padding: 0 60px;
    color: var(--ink-dim);
    font-size: clamp(0.8rem, 2vmin, 1.05rem);
    font-weight: 700;
    letter-spacing: .03em;
    text-align: center;
    text-wrap: balance;
  }

  body.focus {
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  body.focus .wrap {
    max-width: none;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  body.focus h1,
  body.focus .summary,
  body.focus .picker,
  body.focus .scrim,
  body.focus .legend,
  body.focus #phase-tip { display: none; }

  /* Gestures are the only way to change anything in full screen, so the hint
     stays visible there and scales with the viewport. */
  body.focus .hint {
    margin-top: 6px;
    font-size: clamp(0.72rem, 1.7vmin, 0.92rem);
  }

  /* With this padding the stage is 0.96x as tall as it is wide, so dividing
     the leftover height by that sizes the court to whichever viewport axis
     runs out first. The 200px reserve covers the state line, dots, step title,
     controls and the gesture hint. */
  body.focus .stage {
    touch-action: none;   /* full screen always fits, so gestures win here */
    width: min(100vw, calc((100vh - 200px) * 1.04));
    width: min(100vw, calc((100dvh - 200px) * 1.04));
    margin: 0;
    padding: 6% 12% 14%;
  }

  body.focus .step { margin-top: 0; }
  body.focus #phase-title { font-size: clamp(1.15rem, 3.4vmin, 1.9rem); }
  body.focus .controls { width: min(520px, 92vw); margin-top: 8px; }

  body.focus .exit-focus {
    display: grid;
    place-items: center;
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    right: max(10px, env(safe-area-inset-right));
    width: 46px; height: 46px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: var(--card);
    color: var(--ink);
    font: inherit;
    font-size: 1.15rem;
    line-height: 1;
    cursor: pointer;
    z-index: 50;
  }

  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .player, .ball, .btn, .pill, .dot::after { transition: none; }
  }

  @media (min-width: 600px) {
    h1 { font-size: 1.65rem; }
    .pill { font-size: 0.95rem; }
  }
</style>

  // Plain-language wording. Values are a string, or a function of the play.
  const COPY = {
    start:   { title: "Starting rotation",
               tip: "Where everyone lines up before the serve. Stay in order — no overlapping." },
    receive: { title: "Serve receive",
               tip: function (v) { return v.passers; } },
    pass:    { title: "Pass is up",
               tip: function (v) {
                 return SLOT_NAME[v.slot] + " passes it to the setter. " +
                        "The hitters start backing off for their approach.";
               } },
    ready:   { title: "Hitters get ready",
               tip: "Spread out wide — left pin, middle, right pin — so all three are a threat." },
    attack:  { title: function (v) { return v.attackTitle || ("Set " + v.target + " — cover!"); },
               tip:   function (v) { return v.hitter + " Everyone else circles under to cover the block."; } },
    base:    { title: "Base defense",
               tip: "Back to your defensive spots and get in ready position." },
    dbase:   { title: "Base defense",
               tip: "Everyone starts here. Watch their setter and read where the ball is going." },
    dread:   { title: function (v) { return v.def.readTitle; },
               tip:   function (v) { return v.def.readTip; } },
    dset:    { title: function (v) { return v.def.setTitle; },
               tip:   function (v) { return v.def.setTip; } },
    serve:   { title: "Serving",
               tip: "Server steps behind the end line. The other five cover the court." },
    away:    { title: "Serve is up",
               tip: "Ball's away. The server steps in across the end line." },
    over:    { title: "Over the net",
               tip: "As the ball crosses, all six move to their base defense spots." }
  };

  function resolve(x, v) { return typeof x === "function" ? x(v) : x; }

  // Expand each rotation's two axes into the plays the UI actually shows.
  function buildPlays(rot) {
    const plays = {};
    Object.keys(rot.passing).forEach(function (pk) {
      const p = rot.passing[pk];
      const sets = p.sets || rot.sets;
      SET_ORDER.forEach(function (sk) {
        const st = sets[sk];
        if (!st) { return; }
        plays[pk + ":" + sk] = {
          short: SETS[sk].short,
          target: SETS[sk].target,
          attackTitle: SETS[sk].attackTitle,
          hitter: st.hitter,
          passers: p.passers,
          phases: [
            { k: "start",   f: rot.start },
            { k: "receive", f: p.receive },
            { k: "pass",    f: st.pass || p.pass },
            { k: "ready",   f: st.ready || p.ready },
            { k: "attack",  f: st.frame },
            { k: "base",    f: rot.base }
          ]
        };
      });
    });
    /* Watch the serve travel. The front-row pair trade sides along the net
       during this, crossing at roughly t=0.15..0.45, so the keyframes stay
       clear of that band - otherwise a step would rest with two dots on top
       of each other. */
    const sv = rot.serving;
    const server = PLAYERS.filter(function (id) { return sv[1][id][1] > 300; })[0];

    function blend(t, only) {
      const f = {};
      PLAYERS.forEach(function (id) {
        const k = (only && id !== only) ? 0 : t;
        f[id] = [sv[1][id][0] + (sv[2][id][0] - sv[1][id][0]) * k,
                 sv[1][id][1] + (sv[2][id][1] - sv[1][id][1]) * k];
      });
      return f;
    }

    const away = blend(0.3, server);   // only the server has moved yet
    const over = blend(0.8);
    away.ball = [240, 168, 1];         // mid-court, still climbing
    over.ball = [200, -30, 1];         // past the net; base fades it in place

    plays.serving = {
      short: "Serving",
      phases: [
        { k: "start", f: sv[0] },
        { k: "serve", f: sv[1] },
        { k: "away",  f: away },
        { k: "over",  f: over },
        { k: "base",  f: sv[2] }
      ]
    };
    return plays;
  }

  Object.keys(ROTATIONS).forEach(function (r) {
    ROTATIONS[r].plays = buildPlays(ROTATIONS[r]);
  });

  const $ = function (id) { return document.getElementById(id); };

  const els = {};
  PLAYERS.forEach(function (id) { els[id] = $(id); });

  const ball      = $("ball");
  const dotsBox   = $("dots");
  const titleEl   = $("phase-title");
  const tipEl     = $("phase-tip");
  const playBtn   = $("play-btn");
  const prevBtn   = $("prev-btn");
  const nextBtn   = $("next-btn");
  const liberoBtn = $("libero-btn");
  const focusBtn  = $("focus-btn");
  const exitBtn   = $("exit-focus");
  const summaryBtn  = $("summary-btn");
  const summaryText = $("summary-text");
  const scrim       = $("scrim");
  const doneBtn     = $("picker-done");
  const hintEl      = $("hint");
  const focusTitle  = $("focus-title");
  const rotBox    = $("rotation-pills");
  const passBox   = $("passer-pills");
  const playBox   = $("play-pills");
  const topicBox  = $("topic-pills");
  const defBox    = $("defense-pills");
  const passLabel = $("lbl-passer");

  let rotKey  = "1,4";
  let passKey = "RS";
  let topic   = "rotations"; // "rotations" | "defense"
  let mode    = "receive";   // "receive" | "serve" - only under Rotations
  let setKey  = "outside";   // which zone gets set   - drawn at random, see drawPlay
  let slotKey = "left";      // which back-court spot passes - likewise
  let defKey  = "free";      // which defensive scenario - chosen from the pills
  let freeKey = "backL";     // which non-setter passes the free ball
  let swapped = false;       // true on the second lap: partners have traded roles
  let current = null;        // the play being shown, built by rebuild()
  let step    = 0;
  let playing = true;
  let libero  = false;
  let timer   = null;

  const pct = function (v) { return (v / GRID * 100) + "%"; };

  // Which role this dot is playing right now. Defense has its own fixed
  // line-up, so the lap swap doesn't apply there.
  function roleOf(id) { return (swapped && !defending()) ? PARTNER[id] : id; }

  function rotation() { return ROTATIONS[rotKey]; }
  function defending() { return topic === "defense"; }
  function serving()   { return topic === "rotations" && mode === "serve"; }
  function receiving() { return topic === "rotations" && mode === "receive"; }
  function play()     { return current; }
  function phases()   { return current.phases; }

  /* The three back-court passers, keyed by the spot they stand in. The setter
     is excluded - in a 6-2 they start deep but run to the net, they don't pass. */
  function passersOf(receive) {
    const out = {};
    PLAYERS.forEach(function (id) {
      if (id === "S" || receive[id][1] <= 150) { return; }
      const x = receive[id][0];
      out[x < 120 ? "left" : (x < 240 ? "middle" : "right")] = id;
    });
    return out;
  }

  /* The moment of the pass: whoever is taking it steps into the ball, and
     everyone else is halfway from serve receive to their attack spots. That
     50% rule is how the original frames were built, so any passer matches. */
  function passFrame(receive, ready, who, slot) {
    const f = {};
    PLAYERS.forEach(function (id) {
      if (id === who) {
        f[id] = [receive[id][0] + SLOT_STEP[slot][0], receive[id][1] + SLOT_STEP[slot][1]];
      } else {
        f[id] = [(receive[id][0] + ready[id][0]) / 2, (receive[id][1] + ready[id][1]) / 2];
      }
    });
    f.ball = [f[who][0] + 10, f[who][1] + 10, 1];
    return f;
  }

  /* Three beats: hold base, read it, arrive. The middle beat is 42% of the
     way over, same interpolation the serve-receive frames use. */
  function defensePlay(key) {
    const d = DEFENSE[key];
    const baseF = {}, readF = {}, setF = {};
    PLAYERS.forEach(function (id) {
      const s = DEF_SLOT[id], from = DEF_BASE[s], to = d.spots[s];
      baseF[id] = from;
      readF[id] = [from[0] + (to[0] - from[0]) * 0.42, from[1] + (to[1] - from[1]) * 0.42];
      setF[id]  = to;
    });
    // Park the ball where it will appear, so it fades in instead of sliding.
    baseF.ball = [d.ball[0][0], d.ball[0][1], 0];
    readF.ball = d.ball[0];
    setF.ball  = d.ball[1];
    let extra = d.extra || [];
    if (d.passers) {
      const spot = freeKey;
      const at   = [d.spots[spot][0] + 10, d.spots[spot][1] + 10, 1];
      // Show the ball still in flight, halfway from the net to whoever has it.
      setF.ball = [(168 + at[0]) / 2, (-6 + at[1]) / 2, 1];
      extra = [
        { title: SPOT_NAME[spot] + " passes it",
          tip:   "Call it early so nobody collides, then pass it to the setter at the net.",
          ball:  at },
        { title: "Up to the setter",
          tip:   "The pass goes high to the setter — now you're on offense.",
          ball:  [250, 16, 1] }
      ];
    }

    const phases = [{ k: "dbase", f: baseF }, { k: "dread", f: readF }, { k: "dset", f: setF }];

    // Optional follow-on beats. Only the players named in `move` shift; the
    // rest hold whatever they were doing, so each beat stays a small edit.
    let prev = setF;
    extra.forEach(function (x) {
      const f = {};
      PLAYERS.forEach(function (id) { f[id] = (x.move && x.move[id]) || prev[id]; });
      f.ball = x.ball;
      phases.push({ k: "dextra", f: f, copy: { title: x.title, tip: x.tip } });
      prev = f;
    });
    return { def: d, phases: phases };
  }

  // Swap in a pass frame for the drawn passer; everything else is prebuilt.
  function rebuild() {
    if (serving())   { current = rotation().plays.serving; return; }
    if (defending()) { current = defensePlay(defKey); return; }
    const base = rotation().plays[passKey + ":" + setKey];
    const phs = base.phases.slice();
    const who = passersOf(phs[1].f)[slotKey];
    phs[2] = { k: "pass", f: passFrame(phs[1].f, phs[3].f, who, slotKey) };
    current = Object.assign({}, base, { phases: phs, slot: slotKey, passer: who });
  }

  function setOptions() {
    const p = rotation().passing[passKey];
    const sets = p.sets || rotation().sets;
    return SET_ORDER.filter(function (sk) { return sets[sk]; });
  }

  /* The set zone and the passer are chosen for the viewer rather than picked.
     Each draws from a shuffled bag refilled only once empty, so a full pass
     through a bag covers every option exactly once before anything repeats -
     random order, guaranteed coverage of all three front-row zones and all
     three back-court passing spots. The two bags are independent. */
  const zoneBags = {};
  const slotBags = {};
  const freeBag  = {};

  // Cycles all five non-setters before anyone repeats.
  function drawFreePasser() {
    freeKey = drawFrom(freeBag, "free", DEFENSE.free.passers, freeKey);
  }

  function drawFrom(store, key, items, avoid) {
    let bag = store[key];
    if (!bag || !bag.length) {
      bag = items.slice();
      for (let i = bag.length - 1; i > 0; i--) {          // Fisher-Yates
        const j = Math.floor(Math.random() * (i + 1));
        const t = bag[i]; bag[i] = bag[j]; bag[j] = t;
      }
      // Don't let a refill repeat what we just showed.
      if (bag.length > 1 && bag[bag.length - 1] === avoid) {
        const t = bag[bag.length - 1]; bag[bag.length - 1] = bag[0]; bag[0] = t;
      }
      store[key] = bag;
    }
    return bag.pop();
  }

  function drawPlay() {
    if (!defending()) {
      const key = rotKey + "|" + passKey;
      setKey  = drawFrom(zoneBags, key, setOptions(), setKey);
      slotKey = drawFrom(slotBags, key, SLOTS, slotKey);
    }
    rebuild();
    updateSummary();
  }

  function selectRotation(key) {
    rotKey = key;
    if (!rotation().passing[passKey]) { passKey = Object.keys(rotation().passing)[0]; }
    drawPlay();
    reset();
  }

  function cycleRotation(dir) {
    if (defending()) { return; }   // no rotations to move through in defense
    const keys = Object.keys(ROTATIONS);
    const n = keys.length;
    const i = keys.indexOf(rotKey);
    const j = ((i + dir) % n + n) % n;
    // Wrapping past either end completes a lap, so the partners trade roles.
    if ((dir > 0 && j < i) || (dir < 0 && j > i)) { swapped = !swapped; }
    selectRotation(keys[j]);
  }

  // Sideways always steps the Situations row - two options under Rotations,
  // five under Defense - so the gesture means the same thing in both.
  function cycleSituation(dir) {
    if (defending()) {
      const n = DEF_ORDER.length;
      const i = DEF_ORDER.indexOf(defKey);
      defKey = DEF_ORDER[((i + dir) % n + n) % n];
      if (defKey === "free") { drawFreePasser(); }
      reset();
      return;
    }
    mode = serving() ? "receive" : "serve";   // only two, so direction is moot
    if (receiving()) { drawPlay(); }
    reset();
  }

  // No-op where the rotation offers no choice, and while serving - the
  // passer picker is muted then, so a silent change would be misleading.
  function canSwapPasser() {
    return receiving() && Object.keys(rotation().passing).length > 1;
  }

  function cyclePasser() {
    if (!canSwapPasser()) { return; }
    const keys = Object.keys(rotation().passing);
    passKey = keys[(keys.indexOf(passKey) + 1) % keys.length];
    drawPlay();
    reset();
  }

  // Stepping past either end completes a pass, so the next one shows a
  // different zone. The start frame is shared, so the swap is seamless.
  function advance(dir) {
    const next = step + dir;
    if (next >= phases().length || next < 0) {
      if (receiving()) {
        drawPlay();
      } else if (defending() && defKey === "free") {
        drawFreePasser();          // next loop, next passer
        rebuild();
      }
    }
    go(next);
  }

  /* ---------- Rendering ---------- */

  // Row assignment is fixed for a whole rotation, so it's read off the
  // starting line-up: anyone in the far half of the court is back row.
  function renderRoster() {
    if (defending()) {
      // Same roles and colours as the rotations; the back-row ring comes from
      // the defensive slot map so nothing here depends on the rotation.
      PLAYERS.forEach(function (id) {
        const isBack = DEF_SLOT[id].indexOf("back") === 0;
        const isLib  = libero && id === DEF_LIBERO;
        els[id].className = "player " + (isLib ? "lib" : ROLE_CLASS[id]) +
                            (isBack ? " back" : "");
        els[id].textContent = isLib ? "L" : ROLE[id];
      });
      liberoBtn.textContent = "Libero: " + (libero ? "in" : "out");
      liberoBtn.setAttribute("aria-pressed", String(libero));
      return;
    }
    const target = rotation().liberoTarget;
    const start = rotation().start;
    PLAYERS.forEach(function (id) {
      const r      = roleOf(id);
      const isLib  = libero && r === target;
      const isBack = start[r][1] > GRID / 2;
      els[id].className = "player " + (isLib ? "lib" : ROLE_CLASS[r]) + (isBack ? " back" : "");
      els[id].textContent = isLib ? "L" : ROLE[r];
    });
    liberoBtn.textContent = "Libero: " + (libero ? "in" : "out");
    liberoBtn.setAttribute("aria-pressed", String(libero));
  }

  function renderDots() {
    const n = phases().length;
    dotsBox.textContent = "";
    for (let i = 0; i < n; i++) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "dot";
      b.setAttribute("aria-label", "Step " + (i + 1) + " of " + n);
      b.setAttribute("aria-current", String(i === step));
      b.addEventListener("click", function () { pause(); go(i); });
      dotsBox.appendChild(b);
    }
  }

  function renderStep() {
    const v = play();
    const ph = phases()[step];
    const f = ph.f;

    PLAYERS.forEach(function (id) {
      const r = roleOf(id);
      els[id].style.left = pct(f[r][0]);
      els[id].style.top  = pct(f[r][1]);
    });

    ball.style.left    = pct(f.ball[0]);
    ball.style.top     = pct(f.ball[1]);
    ball.style.opacity = f.ball[2];

    const copy = ph.copy || COPY[ph.k];
    titleEl.textContent = resolve(copy.title, v);
    tipEl.textContent   = resolve(copy.tip, v);

    const dots = dotsBox.children;
    for (let i = 0; i < dots.length; i++) {
      dots[i].setAttribute("aria-current", String(i === step));
    }
  }

  function go(i) {
    const n = phases().length;
    step = ((i % n) + n) % n;
    renderStep();
  }

  function reset() {
    rebuild();
    step = 0;
    renderPills();
    renderLegend();
    renderDots();
    renderRoster();
    renderStep();
  }

  /* ---------- Playback ---------- */

  function start() {
    playing = true;
    clearInterval(timer);
    timer = setInterval(function () { advance(1); }, 3200);
    playBtn.textContent = "Pause";
    playBtn.setAttribute("aria-pressed", "true");
  }

  function pause() {
    playing = false;
    clearInterval(timer);
    playBtn.textContent = "Play";
    playBtn.setAttribute("aria-pressed", "false");
  }

  /* ---------- Selector pills ---------- */

  function pill(text, pressed, onClick) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "pill";
    b.textContent = text;
    b.setAttribute("aria-pressed", String(pressed));
    b.addEventListener("click", onClick);
    return b;
  }

  function renderPills() {
    topicBox.textContent = "";
    TOPICS.forEach(function (t) {
      topicBox.appendChild(pill(t[1], topic === t[0], function () {
        if (topic === t[0]) { return; }
        topic = t[0];
        if (receiving()) { drawPlay(); }
        reset();
      }));
    });
    document.body.classList.toggle("mode-defense", defending());

    rotBox.textContent = "";
    Object.keys(ROTATIONS).forEach(function (key) {
      rotBox.appendChild(pill(ROTATIONS[key].label, key === rotKey, function () {
        if (key === rotKey) { return; }
        selectRotation(key);
      }));
    });

    // Serving has no serve-receive, so the passer choice doesn't apply.
    // These are disabled, not just dimmed: pointer-events alone would still
    // leave them reachable and activatable by keyboard.
    passBox.textContent = "";
    Object.keys(rotation().passing).forEach(function (key) {
      const b = pill(rotation().passing[key].short, key === passKey, function () {
        if (key === passKey) { return; }
        passKey = key;
        drawPlay();
        reset();
      });
      b.disabled = !receiving();
      passBox.appendChild(b);
    });
    passBox.classList.toggle("muted", !receiving());
    passLabel.classList.toggle("muted", !receiving());

    playBox.textContent = "";
    defBox.textContent = "";
    DEF_ORDER.forEach(function (key) {
      defBox.appendChild(pill(DEFENSE[key].short, key === defKey, function () {
        if (key === defKey) { return; }
        defKey = key;
        if (key === "free") { drawFreePasser(); }
        reset();
      }));
    });
    MODES.forEach(function (opt) {
      playBox.appendChild(pill(opt[1], !defending() && mode === opt[0], function () {
        if (!defending() && mode === opt[0]) { return; }
        mode = opt[0];
        if (receiving()) { drawPlay(); }
        reset();
      }));
    });

    updateSummary();
  }

  // One-line state for the collapsed phone picker. The passer segment is
  // dropped where the rotation offers no choice, and while serving.
  function updateSummary() {
    const bits = [];
    if (defending()) {
      bits.push("Defense", DEFENSE[defKey].short);
    } else {
      bits.push(rotation().label);
      if (canSwapPasser()) { bits.push(rotation().passing[passKey].short); }
      bits.push(serving() ? "Serving" : "Serve receive");
    }
    summaryText.textContent = bits.join("  ·  ");

    // Fuller version for full screen, where there's room and no other clue.
    const full = [];
    if (defending()) {
      full.push("Defense", DEFENSE[defKey].short);
    } else {
      full.push("Rotation " + rotation().label);
      if (!serving()) {
        full.push(rotation().passing[passKey].short + " passes", "Serve receive");
      } else {
        full.push("Serving");
      }
    }
    if (libero) { full.push("Libero in"); }
    focusTitle.textContent = full.join("  ·  ");

    // Don't advertise the tap where this rotation has no passer to swap to.
    hintEl.textContent = defending()
      ? "Swipe across to change the situation"
      : (canSwapPasser() ? "Tap to change who passes  ·  " : "") +
        "swipe across for serve or serve receive  ·  swipe up or down to change rotation";
  }

  /* Built rather than static so the footer copy and the phone sheet copy
     stay in step from one source. */
  const LEGEND = [
    ["c-set", "S \u2013 Setter  /  RS \u2013 Right side"],
    ["c-oh",  "OH \u2013 Outside"],
    ["c-mid", "M \u2013 Middle"],
    ["lib",   "L \u2013 Libero"],
    ["ring",  "Ring \u2013 Back row"]
  ];

  function renderLegend() {
    const items = LEGEND;
    const lists = document.querySelectorAll(".legend");
    for (let i = 0; i < lists.length; i++) {
      lists[i].textContent = "";
      items.forEach(function (it) {
        const li = document.createElement("li");
        const sw = document.createElement("span");
        const named = (it[0] === "lib" || it[0] === "ring");
        sw.className = "swatch" + (named ? " " + it[0] : "");
        if (!named) { sw.style.background = "var(--" + it[0] + ")"; }
        li.appendChild(sw);
        li.appendChild(document.createTextNode(it[1]));
        lists[i].appendChild(li);
      });
    }
  }

  function setPicker(open) {
    document.body.classList.toggle("picker-open", open);
    summaryBtn.setAttribute("aria-expanded", String(open));
  }
  function pickerOpen() { return document.body.classList.contains("picker-open"); }

  /* ---------- Full-screen focus mode ---------- */

  function nativeFS() {
    return document.fullscreenElement || document.webkitFullscreenElement || null;
  }

  // Both calls are best-effort: a browser that refuses, or lacks the API,
  // still gets the CSS-driven focus mode.
  function enterNativeFS() {
    const el = document.documentElement;
    const fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!fn) { return; }
    try {
      const r = fn.call(el);
      if (r && r.catch) { r.catch(function () {}); }
    } catch (e) { /* ignore */ }
  }

  function exitNativeFS() {
    const fn = document.exitFullscreen || document.webkitExitFullscreen;
    if (!nativeFS() || !fn) { return; }
    try {
      const r = fn.call(document);
      if (r && r.catch) { r.catch(function () {}); }
    } catch (e) { /* ignore */ }
  }

  // Stop an iPad dimming mid-demo. Unsupported browsers just skip it.
  let wakeLock = null;
  function keepAwake(on) {
    if (!navigator.wakeLock) { return; }
    if (on) {
      navigator.wakeLock.request("screen").then(
        function (w) { wakeLock = w; },
        function () { /* denied - not fatal */ }
      );
    } else if (wakeLock) {
      wakeLock.release().catch(function () {});
      wakeLock = null;
    }
  }

  function inFocus() { return document.body.classList.contains("focus"); }

  function setFocus(on) {
    document.body.classList.toggle("focus", on);
    focusBtn.setAttribute("aria-pressed", String(on));
    if (on) { enterNativeFS(); } else { exitNativeFS(); }
    keepAwake(on);
    (on ? exitBtn : focusBtn).focus();
  }

  /* ---------- Events ---------- */

  focusBtn.addEventListener("click", function () { setPicker(false); setFocus(true); });
  exitBtn.addEventListener("click", function () { setFocus(false); });

  summaryBtn.addEventListener("click", function () { setPicker(!pickerOpen()); });
  doneBtn.addEventListener("click", function () { setPicker(false); summaryBtn.focus(); });
  scrim.addEventListener("click", function () { setPicker(false); });

  // Leaving native fullscreen by any other route (Esc, a system gesture)
  // should drop the CSS mode too, or the page would look stuck.
  ["fullscreenchange", "webkitfullscreenchange"].forEach(function (ev) {
    document.addEventListener(ev, function () {
      if (!nativeFS() && inFocus()) { setFocus(false); }
    });
  });

  playBtn.addEventListener("click", function () {
    if (playing) { pause(); } else { start(); }
  });

  prevBtn.addEventListener("click", function () { pause(); advance(-1); });
  nextBtn.addEventListener("click", function () { pause(); advance(1); });

  liberoBtn.addEventListener("click", function () {
    libero = !libero;
    renderRoster();
    updateSummary();   // the full-screen state line names the libero
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft")  { pause(); advance(-1); }
    if (e.key === "ArrowRight") { pause(); advance(1); }
    if (e.key === "Escape") {
      if (pickerOpen()) { setPicker(false); summaryBtn.focus(); }
      else if (inFocus()) { setFocus(false); }
    }
    if (e.key === " " && e.target === document.body) {
      e.preventDefault();
      if (playing) { pause(); } else { start(); }
    }
  });

  /* Court gestures: swipe across = step the Situations row, swipe up/down =
     change rotation, tap = swap who drops back to pass. Stepping and
     pause/resume stay on the buttons and the progress dots. */
  (function () {
    const stage = document.querySelector(".stage");
    const SWIPE = 40;   // px before a drag counts as a swipe
    const TAP   = 12;   // px of slop still counted as a tap
    const TAP_MS = 400;
    let t0 = null;

    stage.addEventListener("touchstart", function (e) {
      // Ignore pinches and any drag that starts while the sheet is up.
      if (e.touches.length !== 1 || pickerOpen()) { t0 = null; return; }
      t0 = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: e.timeStamp };
    }, { passive: true });

    stage.addEventListener("touchend", function (e) {
      if (!t0) { return; }
      const dx = e.changedTouches[0].clientX - t0.x;
      const dy = e.changedTouches[0].clientY - t0.y;
      const adx = Math.abs(dx), ady = Math.abs(dy);
      const quick = (e.timeStamp - t0.t) < TAP_MS;
      t0 = null;

      if (adx < TAP && ady < TAP && quick) {
        cyclePasser();
      } else if (adx > SWIPE && adx > ady * 1.4) {
        cycleSituation(dx < 0 ? 1 : -1);
      } else if (ady > SWIPE && ady > adx * 1.4) {
        cycleRotation(dy < 0 ? 1 : -1);
      }
    }, { passive: true });

    /* touch-action already tells the browser to keep out, but full screen is
       where a stray downward drag costs the most - so while a drag is being
       tracked there, claim it outright. Non-passive so preventDefault works. */
    stage.addEventListener("touchmove", function (e) {
      if (t0 && inFocus() && e.cancelable) { e.preventDefault(); }
    }, { passive: false });

    stage.addEventListener("touchcancel", function () { t0 = null; }, { passive: true });
  })();

  // Don't keep animating in a background tab.
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      clearInterval(timer);
    } else {
      if (playing) { start(); }
      // A wake lock is dropped automatically when the page is hidden.
      if (inFocus()) { keepAwake(true); }
    }
  });

  drawPlay();
  reset();
  start();
})();
</script>
</body>
</html>
