<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-title" content="VB Tracker"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#eef2f4"><title>Teams · Volleyball</title><link rel="stylesheet" href="./src/teams/teams.css"></head>
<body><header class="appbar"><div class="appbar-inner"><button id="backButton" class="back" type="button" hidden><span aria-hidden="true">‹</span> <span id="backLabel">Teams</span></button><div class="appbar-title"><p id="pageContext" class="eyebrow">Volleyball</p><h1 id="pageTitle">Teams</h1></div><div class="appbar-actions"><button id="themeButton" class="theme" type="button" aria-label="Change app theme">App theme</button><button id="liveLink" class="live" type="button" hidden>Live set</button></div></div></header>
<main><p id="notice" role="status" aria-live="polite">Loading saved teams…</p><section id="content"></section></main>
<dialog id="themeDialog" class="theme-dialog" aria-labelledby="themeTitle"><h2 id="themeTitle">App theme</h2><p class="theme-help">Updates the app buttons and default theme for new teams. Team themes are chosen in each team’s roster settings.</p><div id="themeOptions" class="theme-picker"></div><div class="theme-dialog-actions"><button id="themeDone" class="primary" type="button">Done</button></div></dialog>
<dialog id="reportDialog" class="report-dialog" aria-label="Match report"><div id="reportBody" class="report-body"></div></dialog>
<script>
window.addEventListener('error',event=>{const n=document.getElementById('notice');if(n?.textContent==='Loading saved teams…'){n.classList.add('error');n.textContent=event.message?`Teams app failed to start: ${event.message}`:'Teams app files could not be loaded. Close all Volleyball tabs and reopen this page.';}},true);
window.addEventListener('unhandledrejection',event=>{const n=document.getElementById('notice');if(n?.textContent==='Loading saved teams…'){n.classList.add('error');n.textContent=`Teams app failed to start: ${event.reason?.message??event.reason??'unknown error'}`;}},true);
</script>
<script type="module" src="./src/teams/teams.mjs"></script></body></html>
